# Debug pod to test SSM access
apiVersion: v1
kind: Pod
metadata:
  name: ssm-debug
spec:
  serviceAccountName: myce-service-account
  containers:
  - name: debug
    image: juanpark80/myce-backend:latest
    command: ["/bin/bash"]
    args: ["-c", "aws sts get-caller-identity && echo '---' && aws ssm get-parameter --region ap-northeast-2 --name '/myce/db-url' 2>&1 || true"]
    env:
    - name: AWS_REGION
      value: "ap-northeast-2"
  restartPolicy: Never