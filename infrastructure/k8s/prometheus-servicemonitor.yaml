# ServiceMonitor for Prometheus to auto-discover MYCE pods
# This enables automatic scraping of pod metrics as pods scale up/down

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: myce-server-monitor
  namespace: default
  labels:
    app: myce-server
    release: prometheus
spec:
  selector:
    matchLabels:
      app: myce-server
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 15s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - default

---
